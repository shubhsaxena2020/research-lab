persona: reproducibility_reviewer
summary: |
  The paper reports a pre-registered negative result on a four-rung negative ladder for a retrieval-feature abstention gate over SQuAD v2.0, with public data, an end-to-end command block, and disclosed defects. Reproducibility is above average in intent but blocked on execution: no seed is given for the article split or item sampling, no lockfile or hardware note exists, no run id maps a headline number to a logged output, and the code licence is unstated. The frozen run's pre-registration hash is also recorded as a single '#' character, which breaks audit of the freeze from the paper alone.
strengths:
  - "§8 gives a literal, end-to-end command sequence covering every table, figure, control arm and ablation, including the spec-corrected re-run."
  - "Public data with stated licences and per-request URL/status/size/checksum logs in 04_experiments/data/TRANSFER-DATA.md (§7)."
  - "Bootstrap seed (12345), 10000 resamples, BCa method, paired joint resampling and article-level clustering cross-check are all stated (§3.6, §4.7)."
  - "The paper names its own irreproducible/degenerate parts — the dense-block defect (§4.6), the '#' hash defect (§8), R2 incompleteness and the exploratory over-refusal breach — which strengthens it."
  - "Numerals are bound to 04_experiments/RESULTS-INDEX.json and tables are generated by make_paper_assets.py rather than hand-typed (title block)."
weaknesses:
  - "No seed is given for the article-disjoint dev/held-out split or for the 400-question per-rung sampling, so the 1873/1879 item sets cannot be regenerated (§3.1, §8)."
  - "No lockfile or pinned requirements; interpreter and library versions live only in an unspecified 'session status file beside the results' (§8)."
  - "No run id or output file maps any headline number to a logged run, despite the claim that every numeral is bound to RESULTS-INDEX.json (§8; Abstract; Tables 3-7)."
  - "Code licence is not stated even though data licences are, so the artifact's release terms are undefined (§7)."
  - "The frozen run records its pre-registration hash as a single '#' character because the hash-reading line splits on whitespace and takes the first token of a comment line (§8)."
  - "Logistic-regression and gate hyperparameters (penalty, C, solver, threshold search) are unspecified (§3.3, §3.4)."
  - "No smoke test or minimum configuration is documented, and the full run's hardware requirement is unstated (§8)."
  - "R4's answer-span replacement rule ('same-surface-type value') and the reader model used for the §4.7 baseline are unnamed (§3.1, §4.7)."
questions:
  - "What is the article-split seed, and where is the committed split file with its checksum?"
  - "Will a pinned requirements file and a hardware/CUDA/OS note be added before submission?"
  - "Can run ids or results-file paths be added beside each command in §8?"
  - "Under what licence will the code be released, and is a LICENSE file committed?"
  - "Has the '#' hash-reading defect been fixed in the current repository state?"
  - "What are the exact logistic-regression hyperparameters in gate.py?"
soundness: 2
presentation: 3
contribution: 3
confidence: 4
overall: 5
decision: borderline
must_fix:
  - claim: "The article-disjoint dev/held-out split and the per-rung item sampling have no stated seed, so the 1873/1879 item sets cannot be regenerated."
    where: "§3.1, §8 (build_items.py, 'seeds fixed')"
    evidence_needed: "The integer seed(s) for article splitting and for the 400-question sampling per split, plus the committed split file path and sha256 and the sampling script's RNG call."
  - claim: "No lockfile or pinned requirements are shipped; library and interpreter versions live only in an unspecified session status file."
    where: "§8, final paragraph"
    evidence_needed: "A requirements.txt or lockfile with exact pins committed in the repo, plus OS, CPU/GPU model and count, driver/CUDA versions, and the Python interpreter version recorded in §8."
  - claim: "Headline numbers are bound to RESULTS-INDEX.json but no run id or output file is given, so a rerun cannot be checked against the reported value."
    where: "§8 command block; Abstract; Tables 3-7"
    evidence_needed: "For each table, the run id or results JSON path and the command that produced it, listed beside the command in §8."
  - claim: "The code licence is not stated even though data licences are, so the artifact's release terms are undefined."
    where: "§7"
    evidence_needed: "A LICENSE file in the repository root and a one-line licence statement in §7 naming it."
  - claim: "The frozen run records its pre-registration hash as a single '#' character, so the freeze cannot be audited from the paper's reported line."
    where: "§8, penultimate paragraph"
    evidence_needed: "The corrected hash-reading line (or the four hashes from PREREGISTRATION.sha256 printed in §8) and a re-run showing the recorded hash matches."
  - claim: "Logistic-regression and gate hyperparameters are unspecified."
    where: "§3.3, §3.4"
    evidence_needed: "The exact model configuration (penalty, C, solver, max_iter, standardisation) and threshold-search procedure as committed in gate.py, quoted in §3.3."
  - claim: "No smoke test or minimum configuration is provided, and the full run's resource needs are unstated, so a reviewer cannot check the artifact in minutes."
    where: "§8"
    evidence_needed: "A documented smoke-test command on a small config (single CPU, under ten minutes) and the hardware requirement for the full run."
  - claim: "R4's answer-span replacement rule and the reader model used for the §4.7 baseline are unnamed, so those two results cannot be reproduced."
    where: "§3.1, §4.7"
    evidence_needed: "The type-matching rule and any inspected examples for R4 substitutions, and the reader model name and version, in §3.1 and §4.7 respectively."
